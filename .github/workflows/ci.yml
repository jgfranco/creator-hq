name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: creator
          POSTGRES_DB: creator_hq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://creator:creator@localhost:5432/creator_hq?schema=public
      # Throwaway values for CI only
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Also runs `prisma generate` (postinstall)
      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check the schema has no changes missing a migration
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
